name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    # Use the existing charahome-private runner group; do not fall back to GitHub-hosted runners.
    runs-on:
      group: charahome-private
      labels: charahome-linux
    container:
      # Match the pinned Node 20 container and unprivileged user used by three-chara CI.
      image: node@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
      options: --user 1201:1201
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Verify shader toolchain
        run: npm run tools:setup && npm run tools:check
      - name: Build package and shaders
        run: npm run build
      - name: Vitest
        run: npm exec -- vitest run
