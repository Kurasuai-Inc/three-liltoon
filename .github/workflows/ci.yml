name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: liltoon-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on:
      group: three-chara-regression
      labels: three-chara-light
    env:
      DXC_PATH: /home/kurasuai4090/.local/share/vulkan-sdk/1.4.357.1/x86_64/bin/dxc
      SPIRV_CROSS_PATH: /home/kurasuai4090/.local/share/vulkan-sdk/1.4.357.1/x86_64/bin/spirv-cross
      SPIRV_VAL_PATH: /home/kurasuai4090/.local/share/vulkan-sdk/1.4.357.1/x86_64/bin/spirv-val
      LD_LIBRARY_PATH: /home/kurasuai4090/.local/share/vulkan-sdk/1.4.357.1/x86_64/lib
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run tools:check
      - run: npm run typecheck
      - run: npx vitest run test/unit --maxWorkers=4 --minWorkers=1
      - run: npm run build:package
